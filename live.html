<body>
<div class="cadre">

<div class="plateau">
  <video autoplay muted loop playsinline poster="/photos/t2.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;"><source src="/live-demo.mp4" type="video/mp4"></video>
  <div class="plateau__haut">
    <span class="jeton jeton--live"><i></i>LIVE</span>
    <span class="jeton"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#EFE9EA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path d="M2 12 s3.5 -6 10 -6 10 6 10 6 -3.5 6 -10 6 -10 -6 -10 -6 Z"/><circle cx="12" cy="12" r="2.6"/></svg> <span id="live-vues">118</span></span>
    <span style="flex:1 1 auto;"></span>
    <a class="rond" href="#" data-action="Signalement transmis à la modération. Merci." data-apres=""><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#EFE9EA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 4 v17 M5 5 h11 l-1.6 3.4 L16 12 H5"/></svg></a>
    <a class="rond" href="/lives"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#EFE9EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M6 6 L18 18 M18 6 L6 18"/></svg></a>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding-top:14px;">
    <div class="vig vig--mini t2"></div>
    <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:2px;">
      <b style="font-size:14px;display:flex;align-items:center;gap:6px;" id="live-nom">Camille &amp; Théo <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex:0 0 auto;"><circle cx="12" cy="12" r="9" fill="#C08B77"/><path d="M8 12.3 L10.7 15 L16 9.6" stroke="#17110F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></b>
      <span style="font-size:11.5px;color:#B5ABAD;" id="live-sous">Avant de sortir · Lucé · 5 km</span>
    </div>
    <span style="min-height:34px;padding:0 14px;border-radius:17px;background:#C08B77;color:#1A1214;font-size:12.5px;font-weight:700;display:flex;align-items:center;cursor:pointer;" data-action="Vous suivez ce profil ✓" data-apres="Suivi ✓">Suivre</span>
  </div>

  <div style="flex:1 1 auto;"></div>

  <div class="encart" style="background:rgba(14,12,13,.66);border-color:#332B2E;margin-bottom:14px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C08B77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10 V7 a4 4 0 0 1 8 0 v3"/></svg><span style="font-size:11.5px;">Capture d'écran bloquée. Toute rediffusion entraîne la suppression du compte.</span>
  </div>

  <div class="tchat" id="tchat">
    <div><b>Nina</b><span>Vous êtes au Loft samedi ?</span></div>
    <div><b>Adrien</b><span>Première fois que je regarde, sympa l'ambiance</span></div>
    <div><b class="hote">Théo</b><span>Oui, on y sera dès 22 h</span></div>
  </div>

  <div class="saisie"><input id="tchat-champ" type="text" placeholder="Dire quelque chose" autocomplete="off" style="flex:1 1 auto;min-height:46px;border-radius:23px;background:rgba(14,12,13,.7);border:1px solid #332B2E;padding:0 18px;font:inherit;font-size:13.5px;color:#EFE9EA;-webkit-appearance:none;"><u id="tchat-envoyer" style="cursor:pointer;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1214" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 12 L20 4 L15 20 L12 13 Z"/></svg></u></div>
</div>

</div>
</body>
