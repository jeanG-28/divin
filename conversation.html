<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0C0D">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Divin">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<title>Conversation · Divin</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="cadre">

<div class="ecran">

  <div class="barre" style="border-bottom:1px solid #201B1D;">
    <a class="retour" href="/messages"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9093" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg></a>
    <div class="vig vig--mini t2"></div>
    <div style="display:flex;flex-direction:column;gap:2px;">
      <b style="font-size:15px;" id="conv-nom">Camille &amp; Théo</b>
      <span style="font-size:11px;color:#8CB79A;">En ligne</span>
    </div>
  </div>

  <div id="conv-fil" style="flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:18px 22px;">
    <div style="align-self:flex-start;max-width:78%;padding:10px 14px;border-radius:14px;border-bottom-left-radius:4px;background:#221B1D;color:#EFE9EA;font-size:14px;line-height:1.45;">On sera au Loft samedi soir, vous venez ?</div>
    <div style="align-self:center;font-size:10.5px;color:#4E4547;padding:4px 0;">Aujourd'hui, 14 h 20</div>
  </div>

  <div class="encart" style="margin:0 22px 10px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C08B77" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10 V7 a4 4 0 0 1 8 0 v3"></path></svg>
    <span style="font-size:11.5px;">Vos conversations sont conservées. Capture d'écran signalée.</span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding:0 22px calc(16px + env(safe-area-inset-bottom,0px));">
    <input id="conv-champ" type="text" placeholder="Votre message" autocomplete="off"
      style="flex:1 1 auto;min-height:48px;border-radius:24px;background:#141112;border:1px solid #2C2729;padding:0 18px;font:inherit;font-size:14px;color:#EFE9EA;-webkit-appearance:none;">
    <button id="conv-envoyer" style="width:48px;height:48px;flex:0 0 auto;border-radius:50%;background:#C08B77;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1214" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 L20 4 L15 20 L12 13 Z"></path></svg>
    </button>
  </div>

</div>

</div>
</body>
</html>
