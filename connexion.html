<body>
<div class="cadre">

<div class="ecran">
  <div class="barre"><a class="retour" href="/"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9093" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 5 L8 12 L15 19"/></svg></a></div>
  <div class="corps">
    <h1 class="titre">Ravi de vous revoir</h1>
    <div class="txt">Connectez-vous pour retrouver votre profil.</div>

    <div class="bloc">
      <input class="champ" type="email" autocomplete="email" placeholder="Votre email" id="email-connexion">
      <input class="champ" type="password" autocomplete="current-password" placeholder="Mot de passe" id="mdp-connexion">
      <div class="txt--petit" id="erreur-connexion" style="color:#C99089;display:none;"></div>
    </div>
  </div>
  <div class="pied"><button class="bouton" id="btn-connexion" style="width:100%;">Se connecter</button></div>
</div>

</div>
